<!DOCTYPE html>
<html lang="en">
<head>
    <title> Attributes </title>
</head>
<body>
     <form action="restaurant.html" method="get">

        <label for="username">Username:  </label>
        <input type="text" id="username" name="username" required autofocus on ><br><br>
        <input type="email" id="username" name="username" required autocomplete="additional-name"><br><br>
        <input type="button" id="username" name="username" ><br><br>
        <input type="reset" id="username" name="username" required><br><br>
        <input type="tel" id="username" name="username" required><br><br>
        <input type="range" id="username" name="username" required><br><br>
        <input type="file" id="username" name="username" required><br><br>
        <input type="date" id="username" name="username" required><br><br>
        <input type="datetime" id="username" name="username" required><br><br>
        <input type="datetime-local" id="username" name="username" required><br><br>
        <input type="radio" id="username" name="username" required><br><br>
        <input type="checkbox" id="username" name="username" required><br><br>
        <input type="url" id="username" name="username" required><br><br>
        <input type="color" id="username" name="username" required><br><br>
        <label for="password">Password:  </label>
        <input type="password" id="password" name="password" required><br><br>

    <!-- Clicking this button submits the form and routes the user -->
         <button type="submit">Login</button>
    </form>
</body>
</html>
